<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Solaris0141 | Blog Transmission</title>
    
    <link rel="stylesheet" href="css/blogmenustyles.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;700;800&family=Oswald:wght@400;500;700&family=Noto+Sans+JP:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
     
    <!-- Fixed Noise Overlay -->
    <div class="noise-overlay-fixed pointer-events-none z-50">
      <svg width="100%" height="100%">
        <filter id="noise">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
        </filter>
        <rect width="100%" height="100%" filter="url(#noise)" />
      </svg>
    </div>

    <div class="page-wrapper">
        
        <!-- HEADER -->
        <header class="blog-header">
            <a href="index.html" class="header-title">
                <span class="h-main">solaris0141</span>
                <span class="h-div">//</span>
                <span class="h-sub">Blogs & Writeups</span>
            </a>
            <a href="index.html" class="header-jp">ソラリス</a>
        </header>

        <!-- HERO: LATEST POST (Content Injected via JS) -->
        <section id="hero-section" class="blog-hero">
            <!-- JS will populate this -->
        </section>

        <!-- GRID: ARCHIVES -->
        <section>
            <div class="grid-header">
                <h2 class="section-title">Other_Posts</h2>
                <span style="font-family: var(--font-mono); color: var(--c-beige);">// ARCHIVES</span>
            </div>

            <!-- Blog Grid (Content Injected via JS) -->
            <div id="blog-grid" class="blog-grid">
               <!-- JS will populate this -->
            </div>

            <!-- PAGINATION CONTROLS (Content Injected via JS) -->
            <div id="pagination-container" class="pagination-container">
               <!-- JS will populate this -->
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="simple-footer">
            <div>© 2026 SOLARIS0141<br>ALL RIGHTS RESERVED</div>
        </footer>

    </div>

    <!-- SCRIPTS -->
    <script src="js/blogData.js"></script>
    <script src="js/blogMenuLogic.js"></script>
  </body>
</html>
